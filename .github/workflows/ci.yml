name: CI
on: [push, pull_request]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pkm774
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: sparknest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --workspaces
      - run: npm --workspace=client run typecheck
      - run: npm --workspace=server run db:migrate
        env:
          PG_HOST: localhost
          PG_USER: pkm774
          PG_PASSWORD: pass
          PG_DATABASE: sparknest_test
          PG_PORT: 5432
      - run: npm --workspace=server test -- --coverage
      - run: npm --workspace=client test
      - run: docker compose config
      - run: docker compose build
