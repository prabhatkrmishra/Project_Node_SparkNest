name: Deploy
on:
  push:
    branches: [V2.5, main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/V2.5' || github.ref == 'refs/heads/main'
    needs: [] # run independently; CI already validates
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: docker compose build

