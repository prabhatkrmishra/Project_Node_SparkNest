map $http_cf_connecting_ip $sparknest_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

server {
    # Loopback only: the Cloudflare Tunnel is the only public entry point.
    listen 127.0.0.1:8081;
    server_name _;

    root /var/www/sparknest;
    index index.html;
    client_max_body_size 25m;

    # Keep the public /api prefix; the Express app expects it stripped.
    location /api/ {
        proxy_pass http://127.0.0.1:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $sparknest_client_ip;
        proxy_set_header X-Forwarded-For $sparknest_client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;
}
