# Flyway configuration — committed, no secrets
# Secrets are injected via env vars or flyway.conf.local (gitignored)

flyway.locations=filesystem:server/db/migrations
flyway.table=flyway_schema_history
flyway.baselineOnMigrate=true
flyway.validateOnMigrate=true
flyway.cleanDisabled=false

# Placeholders — overridden by env at runtime
# flyway.url is set by migrate.js / docker-compose
# flyway.user / flyway.password injected via env
