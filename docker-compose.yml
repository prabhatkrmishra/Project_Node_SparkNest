services:
  server:
    build: ./server
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET:-change_me_32_chars_minimum_secret_here}
      FRONTEND_ADDRESS: http://localhost:8080
      BACKEND_ADDRESS: http://localhost:3000
      DATA_ROOT: /data
      SECURE_COOKIE: "false"
      HTTP_ONLY: "true"
      SAME_SITE: lax
    ports:
      - "3000:3000"
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  appdata:
